name: Build and test macOS

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test on Apple silicon
        run: |
          xcodebuild -version
          xcodebuild test -project app/Yilan.xcodeproj -scheme Yilan \
            -destination 'platform=macOS,arch=arm64' -parallel-testing-enabled NO

  package:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned XcodeGen
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o xcodegen.zip
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip' | shasum -a 256 -c -
          ditto -x -k xcodegen.zip xcodegen-tools
          echo "$RUNNER_TEMP/xcodegen-tools/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build universal archive
        run: EXPECTED_RELEASE_TAG="$GITHUB_REF_NAME" bash scripts/release.sh
      - name: Attest archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/Yilan-*.zip
      - name: Store ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Yilan-macOS
          path: |
            dist/Yilan-*.zip
            dist/Yilan-*.zip.sha256
          if-no-files-found: error
