<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>一览 Logo · 眼睛方向</title>
<style>
body{margin:0;background:#141518;color:#e9e9ee;font:14px -apple-system,"PingFang SC",sans-serif;padding:40px 48px}
h1{font-size:26px;margin:0 0 6px}.sub{color:#9a9ba3;margin:0 0 28px;line-height:1.7;max-width:980px}
.opt{display:grid;grid-template-columns:300px 1fr;gap:36px;padding:28px;border-radius:22px;background:#1c1d21;border:1px solid #2a2b31;margin-bottom:22px}
.opt h2{font-size:20px;margin:16px 0 6px}.opt p{color:#a8a9b1;line-height:1.6;margin:0}
.sizes{display:flex;align-items:flex-end;gap:26px;padding:20px 24px;border-radius:14px}
.dark{background:#0d0e10}.light{background:#ececf0}.wall{background:linear-gradient(135deg,#3b6fb6,#c0739a 60%,#e8b07a)}
.sizes span{display:block;text-align:center;font-size:11px;color:#8a8b92;margin-top:6px}.wall span{color:#fff}
.rows{display:flex;flex-direction:column;gap:12px}
.dock{display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:22px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);width:max-content}
.dock i{display:block;width:56px;height:56px;border-radius:13px}
svg{display:block}.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:7px;background:#2b2c33;color:#c9cad2;margin-right:6px}
</style></head><body>
<h1>C · 一线天光 → 眼睛</h1>
<p class="sub">思路：把“天空 + 水面倒影”合起来，外形正好是一只眼睛。地平线是眼睛的那条缝，也是汉字“一”；太阳和它的倒影合成一个圆，就是瞳孔。一眼望去、一览无余。<br>注意避开撞车：单纯“眼形轮廓 + 实心圆”和美国 CBS 电视台的标志很像，所以这里的眼睛都由天空和倒影组成，中间一定有贯穿的地平线，不用单线描边轮廓。</p>
<div id="root"></div>
<script>
const shell=(id,defs,body)=>`<svg viewBox="0 0 1024 1024" width="SZ" height="SZ"><defs><clipPath id="c${id}"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath><filter id="sh${id}" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".35"/></filter><clipPath id="up${id}"><rect x="0" y="0" width="1024" height="512"/></clipPath><clipPath id="dn${id}"><rect x="0" y="512" width="1024" height="512"/></clipPath><clipPath id="eye${id}"><path d="${EYE}"/></clipPath>${defs}</defs><g filter="url(#sh${id})"><g clip-path="url(#c${id})">${body}</g><rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="5"/></g></svg>`;
// 眼形：两段三次贝塞尔，眼角在 y=512
const EYE='M160 512 C292 252 732 252 852 512 C732 772 292 772 160 512Z';
const pal={
 cool:{bg:['#26307a','#4a2f78','#7a3b6e'],sky:['#2b46b0','#c25a92','#ffb47c'],rf:['#e98b78','#6a3a8e','#28306e']},
 warm:{bg:['#3a2f8a','#c4558a','#f29a6a'],sky:['#4a5fd8','#e07aa0','#ffd29a'],rf:['#ffc49a','#d0709a','#6a3f94']}
};
const defsFor=(id,p)=>`<linearGradient id="bg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p.bg[0]}"/><stop offset=".6" stop-color="${p.bg[1]}"/><stop offset="1" stop-color="${p.bg[2]}"/></linearGradient><radialGradient id="gw${id}" cx=".5" cy=".5" r=".5"><stop offset=".45" stop-color="#ff9e7a" stop-opacity=".32"/><stop offset="1" stop-color="#ff9e7a" stop-opacity="0"/></radialGradient><linearGradient id="sk${id}" gradientUnits="userSpaceOnUse" x1="0" y1="318" x2="0" y2="512"><stop offset="0" stop-color="${p.sky[0]}"/><stop offset=".6" stop-color="${p.sky[1]}"/><stop offset="1" stop-color="${p.sky[2]}"/></linearGradient><linearGradient id="rf${id}" gradientUnits="userSpaceOnUse" x1="0" y1="512" x2="0" y2="706"><stop offset="0" stop-color="${p.rf[0]}"/><stop offset=".5" stop-color="${p.rf[1]}"/><stop offset="1" stop-color="${p.rf[2]}"/></linearGradient><linearGradient id="ln${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".16" stop-color="#ffe9cf" stop-opacity=".9"/><stop offset=".5" stop-color="#fff"/><stop offset=".84" stop-color="#ffe9cf" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="sun${id}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6e2"/><stop offset=".45" stop-color="#ffd09a"/><stop offset=".8" stop-color="#ffa57a" stop-opacity=".55"/><stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/></radialGradient><radialGradient id="sunR${id}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe7c8" stop-opacity=".85"/><stop offset=".6" stop-color="#ffb488" stop-opacity=".45"/><stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/></radialGradient>`;
const taper=(id,x1,x2,h)=>`<path d="M${x1} 512 Q512 ${512-h} ${x2} 512 Q512 ${512+h} ${x1} 512Z" fill="url(#ln${id})"/>`;
const ripples=op=>[[566,250,6],[606,200,5],[646,140,4]].map(([y,w,h])=>`<rect x="${512-w/2}" y="${y}" width="${w}" height="${h*2}" rx="${h}" fill="#ffe2c2" opacity="${op}"/>`).join('');
const eyeBase=(id)=>`<rect width="1024" height="1024" fill="url(#bg${id})"/><circle cx="512" cy="512" r="420" fill="url(#gw${id})"/><g clip-path="url(#eye${id})"><rect x="0" y="0" width="1024" height="512" fill="url(#sk${id})"/><rect x="0" y="512" width="1024" height="512" fill="url(#rf${id})"/>`;
const V={
E1:{name:'E1 · 天光之眼',desc:'天空在上、倒影在下，合起来是一只眼睛；太阳和倒影合成圆形瞳孔，地平线是眼缝，也是“一”。外框是均匀的一圈细描边。完整表达“一眼看完”。',tags:['推荐','眼睛 + 一 + 日出'],p:'cool',
 body:id=>`${eyeBase(id)}<circle cx="512" cy="512" r="104" fill="url(#sun${id})" clip-path="url(#up${id})"/><circle cx="512" cy="512" r="104" fill="url(#sunR${id})" clip-path="url(#dn${id})"/><g clip-path="url(#dn${id})">${ripples(.5)}</g></g><path d="${EYE}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="7"/>${taper(id,120,904,24)}`},
E2:{name:'E2 · 清晰瞳孔',desc:'在 E1 基础上，瞳孔做成一个完整的发光圆（更像“眼睛在看”），太阳不再被地平线切成两半。小尺寸更像眼睛，但“日出”的味道弱一些。',tags:['更像眼睛'],p:'cool',
 body:id=>`${eyeBase(id)}</g><circle cx="512" cy="512" r="112" fill="url(#sun${id})"/><circle cx="512" cy="512" r="112" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="6"/><path d="${EYE}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="7"/>${taper(id,120,904,20)}`},
E3:{name:'E3 · 天光之眼（暖色）',desc:'和 E1 同一个图形，换成更亮的暖色（C3 的配色），在任何 Dock 背景里都更显眼。',tags:['显眼','暖色'],p:'warm',
 body:id=>`${eyeBase(id)}<circle cx="512" cy="512" r="104" fill="url(#sun${id})" clip-path="url(#up${id})"/><circle cx="512" cy="512" r="104" fill="url(#sunR${id})" clip-path="url(#dn${id})"/><g clip-path="url(#dn${id})">${ripples(.55)}</g></g><path d="${EYE}" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="7"/>${taper(id,120,904,24)}`}
};
let n=0;const icon=(k,s)=>{const id=k+(n++);return shell(id,defsFor(id,pal[V[k].p]),V[k].body(id)).replaceAll('SZ',s)};
const row=(k,cls)=>`<div class="sizes ${cls}">${[[128,'128'],[64,'64'],[32,'32'],[16,'16']].map(([s,l])=>`<div>${icon(k,s)}<span>${l} pt</span></div>`).join('')}${cls!=='light'?`<div style="margin-left:auto"><div class="dock">${['#3a7bd5','#e0574a','#36b37e'].map(c=>`<i style="background:${c}"></i>`).join('')}${icon(k,72).replace('width="72" height="72"','width="72" height="72" style="margin:-8px"')}<i style="background:#f2b233"></i></div><span>${cls==='wall'?'Dock · 彩色壁纸':'Dock · 深色'}</span></div>`:''}</div>`;
document.getElementById('root').innerHTML=Object.keys(V).map(k=>`<div class="opt"><div>${icon(k,260)}<h2>${V[k].name}</h2><p>${V[k].desc}</p><div style="margin-top:10px">${V[k].tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="rows">${row(k,'dark')}${row(k,'wall')}${row(k,'light')}</div></div>`).join('');
</script></body></html>
