<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>一览 Logo 方案</title>
<style>
body{margin:0;background:#141518;color:#e9e9ee;font:14px -apple-system,"PingFang SC",sans-serif;padding:40px 48px}
h1{font-size:26px;margin:0 0 6px}.sub{color:#9a9ba3;margin:0 0 32px}
.opt{display:grid;grid-template-columns:300px 1fr;gap:36px;padding:28px;border-radius:22px;background:#1c1d21;border:1px solid #2a2b31;margin-bottom:22px}
.opt h2{font-size:20px;margin:16px 0 6px}.opt p{color:#a8a9b1;line-height:1.6;margin:0}
.sizes{display:flex;align-items:flex-end;gap:26px;padding:20px 24px;border-radius:14px}
.dark{background:#0d0e10}.light{background:#ececf0}
.sizes span{display:block;text-align:center;font-size:11px;color:#8a8b92;margin-top:6px}
.rows{display:flex;flex-direction:column;gap:12px}
.dock{display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);width:max-content}
.dock i{display:block;width:56px;height:56px;border-radius:13px}
svg{display:block}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:7px;background:#2b2c33;color:#c9cad2;margin-right:6px}
</style></head><body>
<h1>一览 · App 图标方案</h1>
<p class="sub">四个方向，均为原创图形，都按 macOS 图标网格（1024 画布、824 主体、留出阴影空间）。每个都展示大尺寸、Dock、访达小尺寸，以及深浅背景。</p>
<div id="root"></div>
<script>
const W=(inner,id)=>`<svg viewBox="0 0 1024 1024" width="SZ" height="SZ"><defs><clipPath id="c${id}"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath><filter id="sh${id}" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".35"/></filter>DEFS</defs><g filter="url(#sh${id})"><g clip-path="url(#c${id})">${inner}</g><rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="5"/></g></svg>`;

const icons={
A:{name:'A · 风景 + 玻璃条（设计稿现有方案，按网格校正）',desc:'夕阳山景，下方一道玻璃条，既是汉字“一”，也是缩略图栏。信息最丰富，但 32pt 以下细节会糊。',tags:['具象','暖色'],
 defs:id=>`<linearGradient id="sky${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23255e"/><stop offset=".55" stop-color="#c8577a"/><stop offset="1" stop-color="#f7b36c"/></linearGradient><radialGradient id="sn${id}"><stop offset="0" stop-color="#fff2d6"/><stop offset=".3" stop-color="#ffd59a" stop-opacity=".85"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/></radialGradient><linearGradient id="gl${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".16"/></linearGradient>`,
 body:id=>`<rect width="1024" height="1024" fill="url(#sky${id})"/><circle cx="620" cy="420" r="230" fill="url(#sn${id})"/><circle cx="620" cy="420" r="62" fill="#fff4dc"/><path d="M100 610 L250 470 L350 545 L470 410 L620 575 L740 500 L924 630 V924 H100Z" fill="#6c3c69"/><path d="M100 720 L280 600 L420 690 L560 610 L730 730 L924 660 V924 H100Z" fill="#3a2244"/><rect x="210" y="680" width="604" height="150" rx="75" fill="url(#gl${id})" stroke="#fff" stroke-opacity=".7" stroke-width="6"/><rect x="250" y="714" width="116" height="82" rx="20" fill="#fff" fill-opacity=".35"/><rect x="384" y="704" width="140" height="102" rx="24" fill="#fff" fill-opacity=".92"/><rect x="542" y="714" width="116" height="82" rx="20" fill="#fff" fill-opacity=".35"/><rect x="676" y="714" width="100" height="82" rx="20" fill="#fff" fill-opacity=".2"/>`},
B:{name:'B · 极简「一」',desc:'一道厚玻璃横条，里面一排格子从中间向两边渐淡：横条是“一”，最亮的一格是正在看的这张，两边是前后的图。背后是应用里的环境光渐变。16pt 也认得出。',tags:['极简','小尺寸清晰','推荐'],
 defs:id=>`<linearGradient id="bg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2a6b"/><stop offset=".55" stop-color="#6b3a8c"/><stop offset="1" stop-color="#e0785a"/></linearGradient><radialGradient id="glow${id}" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#ffb98a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb98a" stop-opacity="0"/></radialGradient><linearGradient id="bar${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset="1" stop-color="#fff" stop-opacity=".22"/></linearGradient>`,
 body:id=>`<rect width="1024" height="1024" fill="url(#bg${id})"/><rect width="1024" height="1024" fill="url(#glow${id})"/><rect x="176" y="420" width="672" height="184" rx="92" fill="url(#bar${id})" stroke="#fff" stroke-opacity=".75" stroke-width="7"/><rect x="226" y="474" width="84" height="76" rx="22" fill="#fff" fill-opacity=".28"/><rect x="326" y="466" width="96" height="92" rx="26" fill="#fff" fill-opacity=".5"/><rect x="440" y="452" width="144" height="120" rx="34" fill="#fff"/><rect x="602" y="466" width="96" height="92" rx="26" fill="#fff" fill-opacity=".5"/><rect x="714" y="474" width="84" height="76" rx="22" fill="#fff" fill-opacity=".28"/>`},
C:{name:'C · 一线天光（地平线之眼）',desc:'一枚圆形“眼睛/镜头”，被一道发光的横线切开：上半是天空，下半是倒影，横线就是“一”，也是一眼望到的地平线（一览无余）。图形原创、对称、好记，小尺寸是“圆 + 一横”。',tags:['原创图形','寓意“一览无余”'],
 defs:id=>`<linearGradient id="bg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151b3d"/><stop offset="1" stop-color="#0c0f22"/></linearGradient><linearGradient id="sk${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3f9a"/><stop offset=".7" stop-color="#b8568a"/><stop offset="1" stop-color="#ffb37a"/></linearGradient><linearGradient id="rf${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9f7a" stop-opacity=".85"/><stop offset=".5" stop-color="#6a3c8c" stop-opacity=".7"/><stop offset="1" stop-color="#1f2660" stop-opacity=".6"/></linearGradient><linearGradient id="ln${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="up${id}"><rect x="0" y="0" width="1024" height="512"/></clipPath><clipPath id="dn${id}"><rect x="0" y="512" width="1024" height="512"/></clipPath>`,
 body:id=>`<rect width="1024" height="1024" fill="url(#bg${id})"/><circle cx="512" cy="512" r="290" fill="url(#sk${id})" clip-path="url(#up${id})"/><circle cx="512" cy="512" r="290" fill="url(#rf${id})" clip-path="url(#dn${id})"/><circle cx="512" cy="512" r="290" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="8"/><rect x="150" y="496" width="724" height="32" rx="16" fill="url(#ln${id})"/><ellipse cx="512" cy="512" rx="150" ry="26" fill="#fff4dc" opacity=".55"/>`},
D:{name:'D · 汉字「览」玻璃字标',desc:'白色玻璃质感的“览”字，背后是环境光渐变。中文用户辨识度高；海外用户只当作图形。注意：这里临时用了系统字体，定稿时要请设计师手绘/重新造字，不能直接用苹方等字体（版权和原创性）。',tags:['中文特色','字标'],
 defs:id=>`<linearGradient id="bg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22306f"/><stop offset=".6" stop-color="#5b3a8a"/><stop offset="1" stop-color="#d9735e"/></linearGradient><linearGradient id="tx${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".72"/></linearGradient>`,
 body:id=>`<rect width="1024" height="1024" fill="url(#bg${id})"/><text x="512" y="700" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-weight="600" font-size="520" fill="url(#tx${id})">览</text>`}
};
let n=0;
function icon(k,s){const id=k+(n++);const o=icons[k];return W(o.body(id),id).replace('DEFS',o.defs(id)).replaceAll('SZ',s)}
document.getElementById('root').innerHTML=Object.keys(icons).map(k=>{const o=icons[k];return`<div class="opt"><div>${icon(k,260)}<h2>${o.name}</h2><p>${o.desc}</p><div style="margin-top:10px">${o.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="rows">
<div class="sizes dark">${[[128,'128'],[64,'64'],[32,'32'],[16,'16']].map(([s,l])=>`<div>${icon(k,s)}<span>${l} pt</span></div>`).join('')}<div style="margin-left:auto"><div class="dock">${['#3a7bd5','#e0574a','#36b37e'].map(c=>`<i style="background:${c}"></i>`).join('')}${icon(k,72).replace('width="72" height="72"','width="72" height="72" style="margin:-8px"')}<i style="background:#f2b233"></i></div><span>Dock</span></div></div>
<div class="sizes light">${[[128,'128'],[64,'64'],[32,'32'],[16,'16']].map(([s,l])=>`<div>${icon(k,s)}<span>${l} pt</span></div>`).join('')}</div></div></div>`}).join('');
</script></body></html>
