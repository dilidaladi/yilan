<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- 一览 App 图标 · C1「一线天光」：日出 + 水面倒影。按 macOS 图标网格：1024 画布，824 主体，圆角 185 -->
<defs>
 <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
 <clipPath id="up"><rect x="0" y="0" width="1024" height="512"/></clipPath>
 <clipPath id="dn"><rect x="0" y="512" width="1024" height="512"/></clipPath>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".35"/></filter>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26307a"/><stop offset=".6" stop-color="#4a2f78"/><stop offset="1" stop-color="#7a3b6e"/></linearGradient>
 <radialGradient id="gw" cx=".5" cy=".5" r=".5"><stop offset=".5" stop-color="#ffa07a" stop-opacity=".45"/><stop offset="1" stop-color="#ff9e7a" stop-opacity="0"/></radialGradient>
 <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b46b0"/><stop offset=".62" stop-color="#c25a92"/><stop offset="1" stop-color="#ffb47c"/></linearGradient>
 <linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e98b78"/><stop offset=".45" stop-color="#6a3a8e"/><stop offset="1" stop-color="#28306e"/></linearGradient>
 <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".18" stop-color="#ffe9cf" stop-opacity=".9"/><stop offset=".5" stop-color="#fff"/><stop offset=".82" stop-color="#ffe9cf" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <radialGradient id="sun" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#fff3d8"/><stop offset=".35" stop-color="#ffc58a" stop-opacity=".9"/><stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/></radialGradient>
<linearGradient id="rp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd9b0" stop-opacity="0"/><stop offset=".5" stop-color="#ffe6c8"/><stop offset="1" stop-color="#ffd9b0" stop-opacity="0"/></linearGradient><radialGradient id="vg" cx=".5" cy=".5" r=".5"><stop offset=".82" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#0a0a30" stop-opacity=".35"/></radialGradient></defs>
<g filter="url(#sh)">
 <g clip-path="url(#body)">
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="400" fill="url(#gw)"/>
  <circle cx="512" cy="512" r="290" fill="url(#sk)" clip-path="url(#up)"/>
  <circle cx="512" cy="512" r="130" fill="url(#sun)" clip-path="url(#up)"/><circle cx="512" cy="512" r="46" fill="#fff4e0" opacity=".9" clip-path="url(#up)"/>
  <circle cx="512" cy="512" r="290" fill="url(#rf)" clip-path="url(#dn)"/>
  <g clip-path="url(#dn)" fill="url(#rp)">
   <rect x="352" y="556" width="320" height="9" rx="4.5" opacity=".9"/><rect x="384" y="594" width="256" height="8" rx="4" opacity=".7"/><rect x="420" y="636" width="184" height="7" rx="3.5" opacity=".5"/><rect x="456" y="682" width="112" height="6" rx="3" opacity=".35"/>
  </g>
  <circle cx="512" cy="512" r="290" fill="url(#vg)"/><circle cx="512" cy="512" r="290" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="5"/>
  <path d="M130 512 Q512 486 894 512 Q512 538 130 512Z" fill="url(#ln)"/>
 </g>
 <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="5"/>
</g>
</svg>
