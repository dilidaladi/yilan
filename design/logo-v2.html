<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>一览 图标 · 精修</title>
<style>
body{margin:0;background:#141518;color:#e9e9ee;font:14px -apple-system,"PingFang SC",sans-serif;padding:40px 48px}
h1{font-size:26px;margin:0 0 6px}.sub{color:#9a9ba3;margin:0 0 28px;line-height:1.7;max-width:1000px}
.opt{display:grid;grid-template-columns:300px 1fr;gap:36px;padding:28px;border-radius:22px;background:#1c1d21;border:1px solid #2a2b31;margin-bottom:22px}
.opt h2{font-size:20px;margin:16px 0 6px}.opt p{color:#a8a9b1;line-height:1.6;margin:0}
.sizes{display:flex;align-items:flex-end;gap:26px;padding:20px 24px;border-radius:14px}
.dark{background:#0d0e10}.light{background:#ececf0}.wall{background:linear-gradient(135deg,#3b6fb6,#c0739a 60%,#e8b07a)}
.sizes span{display:block;text-align:center;font-size:11px;color:#8a8b92;margin-top:6px}.wall span{color:#fff}
.rows{display:flex;flex-direction:column;gap:12px}
.dock{display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:22px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);width:max-content}
.dock i{display:block;width:56px;height:56px;border-radius:13px}
svg{display:block}.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:7px;background:#2b2c33;color:#c9cad2;margin-right:6px}
</style></head><body>
<h1>一线天光 · 精修</h1>
<p class="sub">上一版的毛病：水面上四道一样的灰条像“菜单/列表”图标；太阳只是一团模糊的光；圆的白边又粗又灰，整体显得廉价。<br>这一版：太阳做成清晰的半圆；水面改成太阳在水里拉出的一条碎金光带（一道道长短不一的暖色波光）；去掉粗白边；颜色更干净。下面三版供比较。</p>
<div id="root"></div>
<script>
const SQ='<rect x="100" y="100" width="824" height="824" rx="185"/>';
const frame=(id,defs,body)=>`<svg viewBox="0 0 1024 1024" width="SZ" height="SZ"><defs><clipPath id="c${id}">${SQ}</clipPath><clipPath id="up${id}"><rect width="1024" height="512"/></clipPath><clipPath id="dn${id}"><rect y="512" width="1024" height="512"/></clipPath><filter id="sh${id}" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".35"/></filter><filter id="bl${id}"><feGaussianBlur stdDeviation="2"/></filter>${defs}</defs><g filter="url(#sh${id})"><g clip-path="url(#c${id})">${body}</g><rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/></g></svg>`;
// 太阳在水里的碎金光带：长短不一、越往下越窄越淡
const glitter=(cx,y0,scale,col)=>{const d=[[0,150,9,.95],[26,118,8,.85],[50,170,7,.6],[74,96,7,.75],[100,130,6,.5],[126,70,6,.6],[154,100,5,.35],[182,52,5,.45],[212,70,4,.25],[244,34,4,.3]];return d.map(([dy,w,h,o],i)=>{const ww=w*scale, off=(i%2?1:-1)*(i*3);return`<rect x="${cx-ww/2+off}" y="${y0+dy*scale}" width="${ww}" height="${h}" rx="${h/2}" fill="${col}" opacity="${o}"/>`}).join('')};
const common=id=>`<radialGradient id="sun${id}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffaf0"/><stop offset=".7" stop-color="#ffe2b0"/><stop offset="1" stop-color="#ffc98a"/></radialGradient><radialGradient id="halo${id}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffc48e" stop-opacity=".75"/><stop offset=".45" stop-color="#ff9a7a" stop-opacity=".3"/><stop offset="1" stop-color="#ff8a7a" stop-opacity="0"/></radialGradient><linearGradient id="hz${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#ffe8cc" stop-opacity=".85"/><stop offset=".5" stop-color="#fff"/><stop offset=".75" stop-color="#ffe8cc" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`;
const V={
OLD:{name:'上一版（对照）',desc:'',tags:[],raw:true},
A:{name:'A · 圆窗（精修）',desc:'保留圆形视窗：圆里是日出和水面，太阳是清晰的半圆，下面一条碎金光带。圆只用一圈很淡的玻璃边，不再是粗白框。',tags:['保留原构图'],
 defs:id=>common(id)+`<linearGradient id="bg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2563"/><stop offset="1" stop-color="#2a1d4f"/></linearGradient><linearGradient id="sk${id}" gradientUnits="userSpaceOnUse" x1="0" y1="222" x2="0" y2="512"><stop offset="0" stop-color="#2c49b8"/><stop offset=".55" stop-color="#8a55b4"/><stop offset=".85" stop-color="#f08a7a"/><stop offset="1" stop-color="#ffc08e"/></linearGradient><linearGradient id="wt${id}" gradientUnits="userSpaceOnUse" x1="0" y1="512" x2="0" y2="802"><stop offset="0" stop-color="#c46a8a"/><stop offset=".35" stop-color="#4c3a8e"/><stop offset="1" stop-color="#1a2160"/></linearGradient>`,
 body:id=>`<rect width="1024" height="1024" fill="url(#bg${id})"/><circle cx="512" cy="512" r="300" fill="#ff9a7a" opacity=".12"/><g><circle cx="512" cy="512" r="290" fill="url(#sk${id})" clip-path="url(#up${id})"/><circle cx="512" cy="512" r="290" fill="url(#wt${id})" clip-path="url(#dn${id})"/><g clip-path="url(#up${id})"><circle cx="512" cy="512" r="190" fill="url(#halo${id})"/><circle cx="512" cy="512" r="84" fill="url(#sun${id})"/></g><g clip-path="url(#dn${id})"><circle cx="512" cy="512" r="290" fill="none"/>${glitter(512,526,1,'#ffd9ad')}</g></g><circle cx="512" cy="512" r="289" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/><rect x="190" y="509" width="644" height="6" rx="3" fill="url(#hz${id})"/>`},
B:{name:'B · 满幅日出',desc:'去掉圆框，整个图标就是一幅日出海面：地平线横贯整个图标，就是“一”。图形更大更醒目，Dock 里一眼就看到，小尺寸是“一横 + 半个太阳”。',tags:['推荐','最醒目'],
 defs:id=>common(id)+`<linearGradient id="sk${id}" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="560"><stop offset="0" stop-color="#1f2f8f"/><stop offset=".45" stop-color="#5b45a8"/><stop offset=".78" stop-color="#e07a8a"/><stop offset="1" stop-color="#ffbf8a"/></linearGradient><linearGradient id="wt${id}" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="924"><stop offset="0" stop-color="#b8648c"/><stop offset=".35" stop-color="#3f3487"/><stop offset="1" stop-color="#141a52"/></linearGradient><clipPath id="u2${id}"><rect width="1024" height="560"/></clipPath><clipPath id="d2${id}"><rect y="560" width="1024" height="464"/></clipPath>`,
 body:id=>`<rect width="1024" height="560" fill="url(#sk${id})"/><rect y="560" width="1024" height="464" fill="url(#wt${id})"/><g clip-path="url(#u2${id})"><circle cx="512" cy="560" r="260" fill="url(#halo${id})"/><circle cx="512" cy="560" r="120" fill="url(#sun${id})"/></g><g clip-path="url(#d2${id})">${glitter(512,578,1.35,'#ffd9ad')}</g><rect x="100" y="556" width="824" height="8" fill="url(#hz${id})"/>`},
C:{name:'C · 满幅日出（暖）',desc:'和 B 一样，天空更亮更暖（橙粉），Dock 里和大量蓝色图标拉开差别。',tags:['暖色'],
 defs:id=>common(id)+`<linearGradient id="sk${id}" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="560"><stop offset="0" stop-color="#3a3aa0"/><stop offset=".4" stop-color="#a04f9e"/><stop offset=".75" stop-color="#f2867a"/><stop offset="1" stop-color="#ffc98e"/></linearGradient><linearGradient id="wt${id}" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="924"><stop offset="0" stop-color="#d9788a"/><stop offset=".4" stop-color="#6a3a8e"/><stop offset="1" stop-color="#252463"/></linearGradient><clipPath id="u2${id}"><rect width="1024" height="560"/></clipPath><clipPath id="d2${id}"><rect y="560" width="1024" height="464"/></clipPath>`,
 body:id=>`<rect width="1024" height="560" fill="url(#sk${id})"/><rect y="560" width="1024" height="464" fill="url(#wt${id})"/><g clip-path="url(#u2${id})"><circle cx="512" cy="560" r="260" fill="url(#halo${id})"/><circle cx="512" cy="560" r="120" fill="url(#sun${id})"/></g><g clip-path="url(#d2${id})">${glitter(512,578,1.35,'#ffe2bc')}</g><rect x="100" y="556" width="824" height="8" fill="url(#hz${id})"/>`}
};
let n=0;
const icon=(k,s)=>{if(V[k].raw)return`<img src="yilan-icon.svg" width="${s}" height="${s}">`;const id=k+(n++);return frame(id,V[k].defs(id),V[k].body(id)).replaceAll('SZ',s)};
const row=(k,cls)=>`<div class="sizes ${cls}">${[[128,'128'],[64,'64'],[32,'32'],[16,'16']].map(([s,l])=>`<div>${icon(k,s)}<span>${l} pt</span></div>`).join('')}${cls!=='light'?`<div style="margin-left:auto"><div class="dock">${['#3a7bd5','#e0574a','#36b37e'].map(c=>`<i style="background:${c}"></i>`).join('')}<span style="display:block;margin:-8px">${icon(k,72)}</span><i style="background:#f2b233"></i></div><span>${cls==='wall'?'Dock · 彩色壁纸':'Dock · 深色'}</span></div>`:''}</div>`;
document.getElementById('root').innerHTML=Object.keys(V).map(k=>`<div class="opt"><div>${icon(k,260)}<h2>${V[k].name}</h2><p>${V[k].desc}</p><div style="margin-top:10px">${V[k].tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="rows">${row(k,'dark')}${row(k,'wall')}${row(k,'light')}</div></div>`).join('');
</script></body></html>
