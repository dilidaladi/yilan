<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>一览 Logo · C 方案优化</title>
<style>
body{margin:0;background:#141518;color:#e9e9ee;font:14px -apple-system,"PingFang SC",sans-serif;padding:40px 48px}
h1{font-size:26px;margin:0 0 6px}.sub{color:#9a9ba3;margin:0 0 28px;line-height:1.6}
.opt{display:grid;grid-template-columns:300px 1fr;gap:36px;padding:28px;border-radius:22px;background:#1c1d21;border:1px solid #2a2b31;margin-bottom:22px}
.opt h2{font-size:20px;margin:16px 0 6px}.opt p{color:#a8a9b1;line-height:1.6;margin:0}
.sizes{display:flex;align-items:flex-end;gap:26px;padding:20px 24px;border-radius:14px}
.dark{background:#0d0e10}.light{background:#ececf0}.wall{background:linear-gradient(135deg,#3b6fb6,#c0739a 60%,#e8b07a)}
.sizes span{display:block;text-align:center;font-size:11px;color:#8a8b92;margin-top:6px}.wall span{color:#fff}
.rows{display:flex;flex-direction:column;gap:12px}
.dock{display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:22px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);width:max-content}
.dock i{display:block;width:56px;height:56px;border-radius:13px}
svg{display:block}.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:7px;background:#2b2c33;color:#c9cad2;margin-right:6px}
</style></head><body>
<h1>C · 一线天光：优化稿</h1>
<p class="sub">原稿的问题：底色接近纯黑，在深色 Dock 里看不清边界；下半部分是一块平的颜色，缺少“倒影”的感觉；横线两头太虚，小尺寸只剩一个暗圆。<br>下面是原稿 C0 和三个优化版本。边框都是均匀的一圈细描边，没有偏移的高光。</p>
<div id="root"></div>
<script>
const shell=(id,defs,body)=>`<svg viewBox="0 0 1024 1024" width="SZ" height="SZ"><defs><clipPath id="c${id}"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath><filter id="sh${id}" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".35"/></filter><clipPath id="up${id}"><rect x="0" y="0" width="1024" height="512"/></clipPath><clipPath id="dn${id}"><rect x="0" y="512" width="1024" height="512"/></clipPath>${defs}</defs><g filter="url(#sh${id})"><g clip-path="url(#c${id})">${body}</g><rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="5"/></g></svg>`;
// 共用：天空、倒影、地平线
const sky=(id,a,b,c)=>`<linearGradient id="sk${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".62" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient>`;
const refl=(id,a,b,c)=>`<linearGradient id="rf${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".45" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient>`;
const line=id=>`<linearGradient id="ln${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".18" stop-color="#ffe9cf" stop-opacity=".9"/><stop offset=".5" stop-color="#fff"/><stop offset=".82" stop-color="#ffe9cf" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="sun${id}" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#fff3d8"/><stop offset=".35" stop-color="#ffc58a" stop-opacity=".9"/><stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/></radialGradient>`;
// 中间粗、两头细的地平线
const taper=(id,x1,x2,h)=>`<path d="M${x1} 512 Q512 ${512-h} ${x2} 512 Q512 ${512+h} ${x1} 512Z" fill="url(#ln${id})"/>`;
const ripples=(op)=>[[560,300,6],[600,240,5],[648,170,4],[700,100,3]].map(([y,w,h])=>`<rect x="${512-w/2}" y="${y}" width="${w}" height="${h*2}" rx="${h}" fill="#ffe2c2" opacity="${op}"/>`).join('');

const V={
C0:{name:'C0 · 原稿',desc:'对照用。',tags:['原稿'],
 defs:id=>`<linearGradient id="bg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151b3d"/><stop offset="1" stop-color="#0c0f22"/></linearGradient>${sky(id,'#2d3f9a','#b8568a','#ffb37a')}${refl(id,'rgba(255,159,122,.85)','rgba(106,60,140,.7)','rgba(31,38,96,.6)')}<linearGradient id="ln0${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>`,
 body:id=>`<rect width="1024" height="1024" fill="url(#bg${id})"/><circle cx="512" cy="512" r="290" fill="url(#sk${id})" clip-path="url(#up${id})"/><circle cx="512" cy="512" r="290" fill="url(#rf${id})" clip-path="url(#dn${id})"/><circle cx="512" cy="512" r="290" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="8"/><rect x="150" y="496" width="724" height="32" rx="16" fill="url(#ln0${id})"/>`},
C1:{name:'C1 · 日出 + 水面倒影',desc:'底色换成应用里的环境光（深靛蓝→紫），不再发黑。地平线上半露一轮太阳，下半是水面倒影和几道波光。横线中间粗、两头收尖，像一道光。最有画面感。',tags:['推荐','有画面感'],
 defs:id=>`<linearGradient id="bg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26307a"/><stop offset=".6" stop-color="#4a2f78"/><stop offset="1" stop-color="#7a3b6e"/></linearGradient><radialGradient id="gw${id}" cx=".5" cy=".5" r=".5"><stop offset=".5" stop-color="#ff9e7a" stop-opacity=".35"/><stop offset="1" stop-color="#ff9e7a" stop-opacity="0"/></radialGradient>${sky(id,'#2b46b0','#c25a92','#ffb47c')}${refl(id,'#e98b78','#6a3a8e','#28306e')}${line(id)}`,
 body:id=>`<rect width="1024" height="1024" fill="url(#bg${id})"/><circle cx="512" cy="512" r="400" fill="url(#gw${id})"/><circle cx="512" cy="512" r="290" fill="url(#sk${id})" clip-path="url(#up${id})"/><circle cx="512" cy="512" r="110" fill="url(#sun${id})" clip-path="url(#up${id})"/><circle cx="512" cy="512" r="290" fill="url(#rf${id})" clip-path="url(#dn${id})"/><g clip-path="url(#dn${id})">${ripples(.55)}</g><circle cx="512" cy="512" r="290" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="7"/>${taper(id,130,894,26)}`},
C2:{name:'C2 · 玻璃镜片',desc:'圆变成一片厚玻璃镜片，透出背后的环境光渐变；横线从图标左边一直贯穿到右边，像一道地平线把整个图标切开。和应用里的液态玻璃风格最一致，更克制。',tags:['和界面统一','克制'],
 defs:id=>`<linearGradient id="bg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3a9a"/><stop offset=".5" stop-color="#8a4a9a"/><stop offset=".5" stop-color="#5a3580"/><stop offset="1" stop-color="#1f2563"/></linearGradient><linearGradient id="gl${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>${sky(id,'#3b5ad0','#d06a9a','#ffc08a')}${line(id)}`,
 body:id=>`<rect width="1024" height="1024" fill="url(#bg${id})"/><circle cx="512" cy="512" r="300" fill="url(#gl${id})"/><circle cx="512" cy="512" r="96" fill="url(#sun${id})" clip-path="url(#up${id})"/><g clip-path="url(#dn${id})" opacity=".6">${ripples(.5)}</g><circle cx="512" cy="512" r="300" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="7"/><rect x="100" y="501" width="824" height="22" fill="url(#ln${id})"/>`},
C3:{name:'C3 · 暖色黎明',desc:'整体换成更亮的暖色（桃→橙），在深色和浅色背景上都很显眼，和 Dock 里大多数蓝色图标拉开差别。圆和横线保持白色。',tags:['显眼','暖色'],
 defs:id=>`<linearGradient id="bg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2f8a"/><stop offset=".55" stop-color="#c4558a"/><stop offset="1" stop-color="#f29a6a"/></linearGradient>${sky(id,'#4a5fd8','#e07aa0','#ffd29a')}${refl(id,'#ffc49a','#d0709a','#6a3f94')}${line(id)}`,
 body:id=>`<rect width="1024" height="1024" fill="url(#bg${id})"/><circle cx="512" cy="512" r="290" fill="url(#sk${id})" clip-path="url(#up${id})"/><circle cx="512" cy="512" r="110" fill="url(#sun${id})" clip-path="url(#up${id})"/><circle cx="512" cy="512" r="290" fill="url(#rf${id})" clip-path="url(#dn${id})"/><g clip-path="url(#dn${id})">${ripples(.6)}</g><circle cx="512" cy="512" r="290" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="7"/>${taper(id,130,894,26)}`}
};
let n=0;const icon=(k,s)=>{const id=k+(n++);return shell(id,V[k].defs(id),V[k].body(id)).replaceAll('SZ',s)};
const row=(k,cls)=>`<div class="sizes ${cls}">${[[128,'128'],[64,'64'],[32,'32'],[16,'16']].map(([s,l])=>`<div>${icon(k,s)}<span>${l} pt</span></div>`).join('')}${cls!=='light'?`<div style="margin-left:auto"><div class="dock">${['#3a7bd5','#e0574a','#36b37e'].map(c=>`<i style="background:${c}"></i>`).join('')}${icon(k,72).replace('width="72" height="72"','width="72" height="72" style="margin:-8px"')}<i style="background:#f2b233"></i></div><span>${cls==='wall'?'Dock · 彩色壁纸':'Dock · 深色'}</span></div>`:''}</div>`;
document.getElementById('root').innerHTML=Object.keys(V).map(k=>`<div class="opt"><div>${icon(k,260)}<h2>${V[k].name}</h2><p>${V[k].desc}</p><div style="margin-top:10px">${V[k].tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="rows">${row(k,'dark')}${row(k,'wall')}${row(k,'light')}</div></div>`).join('');
</script></body></html>
